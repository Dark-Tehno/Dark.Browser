<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: data:">
<title>Dark Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/theme.css">
<link rel="stylesheet" href="chrome.css">
</head>
<body>
<header class="strip" id="strip">
  <div class="brand" title="Dark Browser">
    <svg width="22" height="22" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <defs><linearGradient id="dmark" x1="2" y1="2" x2="24" y2="24" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#7c5cff"/><stop offset="0.55" stop-color="#3e7bfa"/><stop offset="1" stop-color="#22d3e8"/>
      </linearGradient></defs>
      <circle cx="13" cy="13" r="11" stroke="url(#dmark)" stroke-width="2.4"/>
      <path d="M9.5 7.5H13.2C15.9 7.5 18 9.7 18 13C18 16.3 15.9 18.5 13.2 18.5H9.5V7.5Z" stroke="url(#dmark)" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Открытые вкладки"></div>
  <button class="icon-btn" id="newtab" aria-label="Новая вкладка" title="Новая вкладка (Ctrl+T)">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
  </button>
  <div class="strip-fill"></div>
</header>

<nav class="bar" aria-label="Навигация">
  <button class="icon-btn" id="back" aria-label="Назад" title="Назад (Alt+←)">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4 6 9l5 5"/></svg>
  </button>
  <button class="icon-btn" id="forward" aria-label="Вперёд" title="Вперёд (Alt+→)">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m7 4 5 5-5 5"/></svg>
  </button>
  <button class="icon-btn" id="reload" aria-label="Обновить" title="Обновить (Ctrl+R)">
    <svg id="ic-reload" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 9A5.5 5.5 0 1 1 12.9 5.1"/><path d="M14.5 2.5v3h-3"/></svg>
    <svg id="ic-stop" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="display:none"><path d="m5 5 8 8M13 5l-8 8"/></svg>
  </button>
  <button class="icon-btn" id="home" aria-label="Домашняя страница" title="Домашняя страница (Alt+Home)">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 9 3.5l6 5V15H3z"/><path d="M7.5 15v-4h3v4"/></svg>
  </button>

  <form class="omni" id="omniform" autocomplete="off" novalidate>
    <span class="sec" id="sec" title=""></span>
    <input class="omni-input" id="omnibox" type="text" spellcheck="false" placeholder="Введите адрес или поисковый запрос" aria-label="Адресная строка">
    <button class="icon-btn small" id="star" type="button" aria-label="Добавить в закладки" title="Добавить в закладки (Ctrl+D)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="m8 2 1.8 3.7 4 .6-2.9 2.8.7 4L8 11.2 4.4 13.1l.7-4L2.2 6.3l4-.6z"/></svg>
    </button>
  </form>

  <button class="acct" id="account" title="Dark.Account"></button>
  <button class="icon-btn" id="menu" aria-label="Меню" title="Меню">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><circle cx="9" cy="3.5" r="1.4"/><circle cx="9" cy="9" r="1.4"/><circle cx="9" cy="14.5" r="1.4"/></svg>
  </button>
  <div class="progress" id="progress" hidden></div>
</nav>

<script src="../pages/dom.js"></script>
<script src="chrome.js"></script>
</body>
</html>
