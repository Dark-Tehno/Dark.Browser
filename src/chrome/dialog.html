<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
<title>Dark Browser</title>
<link rel="stylesheet" href="../static/theme.css">
<link rel="stylesheet" href="dialog.css">
</head>
<body>
<main class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <header class="dialog-head" id="drag-region">
    <span class="brand-mark" aria-hidden="true">D</span>
    <span class="brand-name">Dark Browser</span>
    <button class="close" id="close" type="button" aria-label="Закрыть">×</button>
  </header>
  <section class="dialog-content">
    <div class="dialog-icon" id="icon" aria-hidden="true"></div>
    <div class="dialog-copy">
      <h1 id="dialog-title"></h1>
      <p id="message"></p>
      <p class="detail" id="detail"></p>
      <input class="input dialog-input" id="input" type="text" autocomplete="off" spellcheck="false" hidden>
    </div>
  </section>
  <footer class="actions" id="actions"></footer>
</main>
<script src="dialog.js"></script>
</body>
</html>
